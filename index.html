<script>
const nao=document.getElementById("nao");
const sim=document.getElementById("sim");
const pedido=document.getElementById("pedido");
const resposta=document.getElementById("resposta");

function fugir(){
    const maxX=window.innerWidth-nao.offsetWidth-10;
    const maxY=window.innerHeight-nao.offsetHeight-10;
    const x=10+Math.random()*Math.max(1,maxX-10);
    const y=10+Math.random()*Math.max(1,maxY-10);
    nao.style.left=x+"px";
    nao.style.top=y+"px";
}

nao.addEventListener("pointerdown",function(e){
    e.preventDefault();
    fugir();
});

nao.addEventListener("pointerenter",fugir);
nao.addEventListener("mouseenter",fugir);
nao.addEventListener("touchstart",function(e){
    e.preventDefault();
    fugir();
},{passive:false});

nao.addEventListener("click",function(e){
    e.preventDefault();
    fugir();
});

sim.addEventListener("click",function(){
    pedido.classList.add("hidden");
    nao.classList.add("hidden");
    resposta.classList.remove("hidden");
});

fugir();
</script>
